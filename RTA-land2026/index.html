<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTA-land2026</title>
    <style>
        /* تنظیمات ظاهری - استایل هکری و ماتریکسی */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        /* پس‌زمینه متحرک ماتریکس */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        header, .main-content, footer {
            position: relative;
            z-index: 2;
        }
        header {
            margin-top: 40px;
            font-size: 32px;
            font-weight: bold;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.8);
            letter-spacing: 2px;
        }
        .main-content {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 50px 60px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
            border: 2px solid #00ff66;
        }
        .download-btn {
            display: inline-block;
            background-color: #00ff66;
            color: #000;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #00cc52;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.8);
        }
        .sub-text {
            margin-top: 20px;
            font-size: 18px;
            color: #00ff66;
            opacity: 0.9;
        }
        footer {
            margin-bottom: 30px;
            font-size: 16px;
            color: #00ff66;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- بوم انیمیشن ماتریکس -->
    <canvas id="matrix"></canvas>

    <header>RTA-land2026</header>

    <div class="main-content">
        <!-- لینک مستقیم به فایل شما که در کنار این فایل است -->
        <a href="RTA-EFG.rar" class="download-btn" download>دانلود فایل</a>
        <div class="sub-text">ForgeOptifine</div>
    </div>

    <footer>
        RTA-land2026
    </footer>

    <script>
        // کد انیمیشن ماتریکس (Matrix Rain Effect)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01010101010101010101010101010101010101';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
